spring:
  datasource:
    # Same split as production: tests run as the non-owner runtime role, so
    # row-level security is exercised for real (ADR-0003).
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/transithub_test}
    username: ${DB_RUNTIME_USERNAME:transithub_runtime}
    password: ${DB_RUNTIME_PASSWORD}

  flyway:
    enabled: true
    user: ${DB_MIGRATION_USERNAME:transithub_app}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

transithub:
  storage:
    root: ${java.io.tmpdir}/transithub-test-files
    # TEST ONLY: a fixed, public key for throwaway test files. Never use it elsewhere.
    encryption-key: VEVTVC1PTkxZLWtleS1ub3QtZm9yLXJlYWwtZGF0YSE=
  enquiry:
    # All test requests share one address; the limiter has its own unit test.
    max-per-window: 100000
  notifications:
    # Tests call the dispatcher directly; no background sending.
    dispatch-enabled: false
    team:
      support: support@transithub.test
