# Static security analysis of the backend (Java) and frontend (TypeScript) code (R-34).
# Results appear under the repository's Security tab -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # weekly, Monday 04:00 UTC, catches newly published rules

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none        # analyses the source directly; no build needed
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
