
spring:
  datasource:
    # The application runs as a non-owner role, so PostgreSQL row-level
    # security always applies to it (ADR-0003).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transithub_dev}
    username: ${DB_RUNTIME_USERNAME:transithub_runtime}
    password: ${DB_RUNTIME_PASSWORD}

  flyway:
    # Migrations run as the schema owner.
    user: ${DB_MIGRATION_USERNAME:transithub_app}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
