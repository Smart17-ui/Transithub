spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/transithub_test
    username: ${DB_USERNAME:transithub_app}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
